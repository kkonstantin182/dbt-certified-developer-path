version: 2

models:
  - name: stg_stripe__payments
    columns:
      - name: payment_id
        description: "The primary key for payments"
        data_tests:
          - unique
          - not_null
      - name: status
        description: "Status of the payment: fail, success."
        data_tests:
          - accepted_values:
              values:
                - success
                - fail
      - name: order_id
        description: "Foreign key to stg_jaffle_shop__orders.order_date"
      - name: payment_method
        description: "The method of payment: credit_card, bank_transfer, coupon, gift_card."
      - name: amount
        description: The total amount of payment.
      - name: created_at
        description: The payment date.
